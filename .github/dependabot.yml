# 保持 GitHub Actions 与 npm 依赖及时更新
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      playwright:
        patterns:
          - '@playwright/test'
          - 'playwright'
